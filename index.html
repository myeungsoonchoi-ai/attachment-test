<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>애착유형 테스트 | 오늘 한페이지</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf6f1;color:#302d2b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
main{max-width:600px;margin:auto;padding:20px 15px 50px}.brand{text-align:center;color:#777;font-size:12px;letter-spacing:.12em}
header,.box,#result{background:#fff;border-radius:22px;box-shadow:0 7px 24px #0000000c}header{padding:25px 18px;text-align:center;margin-top:8px}
h1{font-size:27px;margin:4px}.sub{color:#716b66;font-size:14px}.scale{background:#f6eee7;border-radius:13px;padding:10px;margin-top:14px;font-size:12px}
.prow{display:flex;justify-content:space-between;margin:18px 2px 6px;font-size:13px;color:#777}.track{height:9px;background:#e9e1da;border-radius:9px;overflow:hidden}.bar{height:100%;background:#739580;transition:.2s}
.box{padding:23px 18px;margin-top:12px}.num{font-size:13px;font-weight:800;color:#739580}.q{font-size:20px;font-weight:800;line-height:1.45;margin:8px 0 18px}
.choice{display:block;border:1px solid #e2d8cf;border-radius:14px;padding:14px;margin:9px 0;cursor:pointer;background:#fffdfa}.choice.selected{background:#e5efe9;border-color:#94b09f;font-weight:800}
.choice span{float:right;color:#668774;font-weight:800}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
button{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.prev{background:#eee7e0}.next{background:#668c77;color:white}button:disabled{opacity:.4}
#result{display:none;padding:24px 18px;text-align:center;margin-top:18px}.rtype{font-size:28px;font-weight:900;margin:8px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}
.sc{background:#f6f0ea;border-radius:13px;padding:10px 3px;font-size:12px}.sc b{display:block;font-size:19px}.desc,.tip{text-align:left;padding:14px;border-radius:14px;line-height:1.65;font-size:14px}.desc{background:#faf7f3}.tip{background:#fff7f3;margin-top:9px;border-left:4px solid #d5b09f}
.actions{display:grid;gap:8px;margin-top:15px}.share{background:#ead8d8;color:#644d4d}.again{background:#ece6df}.foot{font-size:11px;color:#888;margin-top:15px}
</style></head><body><main>
<div class="brand">오늘 한페이지 · SELF TEST</div>
<header id="head"><div style="font-size:27px">♡</div><h1>나는 어떤 애착유형일까?</h1><div class="sub">12개의 질문으로 나의 관계 스타일을 알아보세요.</div><div class="scale">1점 전혀 아니다 · 2점 별로 아니다 · 3점 보통 · 4점 그렇다 · 5점 매우 그렇다</div></header>
<div id="quiz"><div class="prow"><span>진행률</span><b id="pt"></b></div><div class="track"><div class="bar" id="bar"></div></div>
<section class="box"><div class="num" id="num"></div><div class="q" id="q"></div><div id="opts"></div>
<div class="nav"><button class="prev" id="prev">이전</button><button class="next" id="next">다음</button></div></section></div>
<section id="result"><small>오늘 한페이지 결과</small><div class="rtype" id="rtype"></div>
<div class="scores"><div class="sc">안정 성향<b id="s"></b></div><div class="sc">불안 성향<b id="a"></b></div><div class="sc">회피 성향<b id="v"></b></div></div>
<div class="desc" id="desc"></div><div class="tip" id="tip"></div>
<div class="actions"><button class="share" id="share">친구에게 테스트 공유하기</button><button class="again" id="again">다시 테스트하기</button></div>
<div class="foot">※ 자기이해를 위한 간이 테스트이며 전문적인 심리평가나 의학적 진단을 대신하지 않습니다.</div></section>
</main><script>
const Q=["가까운 사람에게 내 감정을 편하게 표현한다.","상대가 나를 떠날까 봐 걱정하는 편이다.","누군가와 너무 가까워지면 부담스럽다.","힘들 때 가까운 사람에게 도움을 청할 수 있다.","연락이 늦어지면 나를 싫어하게 된 건 아닌지 신경 쓰인다.","다른 사람에게 의지하기보다 혼자 해결하는 것이 편하다.","의견이 달라도 관계가 쉽게 깨지지는 않을 거라고 생각한다.","상대의 말투나 표정이 조금만 달라져도 불안해진다.","속마음을 이야기하는 것이 불편할 때가 많다.","가까운 사람을 믿고 의지하는 것이 자연스럽다.","상대에게 사랑받고 있는지 자주 확인하고 싶다.","관계에서 일정한 거리를 유지해야 마음이 편하다."];
const L=["전혀 아니다","별로 아니다","보통이다","그렇다","매우 그렇다"];let i=0,A=Array(12).fill(0);
function draw(){num.textContent=`QUESTION ${i+1}`;q.textContent=Q[i];pt.textContent=`${i+1} / 12`;bar.style.width=((i+1)/12*100)+"%";opts.innerHTML="";
L.forEach((x,k)=>{let d=document.createElement("div");d.className="choice"+(A[i]===k+1?" selected":"");d.innerHTML=`${x}<span>${k+1}점</span>`;d.onclick=()=>{A[i]=k+1;draw()};opts.appendChild(d)});
prev.disabled=i===0;next.disabled=!A[i];next.textContent=i===11?"결과보기":"다음"}
prev.onclick=()=>{if(i){i--;draw();scrollTo(0,0)}};next.onclick=()=>{if(!A[i])return;if(i<11){i++;draw();scrollTo(0,0)}else finish()}
function finish(){let S=A[0]+A[3]+A[6]+A[9],N=A[1]+A[4]+A[7]+A[10],V=A[2]+A[5]+A[8]+A[11],T,D,P;
if(N>=15&&V>=15){T="불안·회피형";D="가까워지고 싶은 마음과 거리를 두고 싶은 마음이 함께 나타날 수 있어요. 관계를 원하면서도 상처받을까 봐 불안하거나 거리를 둘 수 있습니다.";P="관계가 불안할 때 지금 원하는 것이 ‘확인’인지 ‘거리’인지 먼저 살펴보세요."}
else if(S>=N&&S>=V){T="안정형";D="친밀함과 독립성 사이의 균형을 비교적 편안하게 유지하는 편이에요. 갈등이 생겨도 대화로 해결하려는 경향이 있습니다.";P="내 감정과 상대의 감정을 함께 존중하는 관계 습관을 이어가 보세요."}
else if(N>V){T="불안형";D="상대의 반응과 관계의 변화에 민감할 수 있어요. 연락이나 표현이 줄면 사랑받고 있는지 확인하고 싶은 마음이 커질 수 있습니다.";P="상대의 반응을 추측하기 전에 ‘내가 지금 불안하구나’라고 감정을 먼저 알아차려 보세요."}
else{T="회피형";D="지나친 친밀감이나 의존을 부담스럽게 느끼고 혼자 해결하는 것이 편할 수 있어요. 일정한 거리를 유지할 때 편안함을 느끼기도 합니다.";P="믿을 만한 사람에게 작은 감정부터 표현해 보는 것도 좋은 시작이에요."}
quiz.style.display=head.style.display="none";result.style.display="block";rtype.textContent=T;s.textContent=S+"점";a.textContent=N+"점";v.textContent=V+"점";desc.textContent=D;tip.textContent="한페이지 조언 · "+P;scrollTo(0,0)}
again.onclick=()=>{i=0;A.fill(0);result.style.display="none";quiz.style.display=head.style.display="block";draw();scrollTo(0,0)}
share.onclick=async()=>{let d={title:"애착유형 테스트",text:"나는 어떤 애착유형일까? 직접 테스트해보세요.",url:location.href};try{if(navigator.share)await navigator.share(d);else{await navigator.clipboard.writeText(location.href);alert("테스트 주소를 복사했어요.")}}catch(e){}}
draw();
</script></body></html>
